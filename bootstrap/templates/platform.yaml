apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p9-foundation
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: {{ .Values.gitops.repoURL | quote }}
    targetRevision: {{ .Values.gitops.targetRevision | quote }}
    path: platform/foundation
    helm:
      parameters:
        - {name: projectId, value: {{ .Values.platform.projectId | quote }}}
        - {name: region, value: {{ .Values.platform.region | quote }}}
        - {name: zone, value: {{ .Values.platform.zone | quote }}}
        - {name: clusterName, value: {{ .Values.platform.clusterName | quote }}}
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: 20
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true]
---

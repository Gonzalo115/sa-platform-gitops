apiVersion: v1
kind: ConfigMap
metadata:
  name: sa-platform-canary-k6
data:
  canary.js: |
    import http from "k6/http";
    import { check, sleep } from "k6";
    export const options = {
      vus: 5,
      duration: "20s",
      thresholds: {
        http_req_failed: ["rate<0.05"],
        http_req_duration: ["p(95)<500"],
        checks: ["rate>0.95"],
      },
    };
    export default function () {
      const response = http.get(__ENV.TARGET_URL, { timeout: "5s" });
      check(response, { "candidate returns 200": (r) => r.status === 200 });
      sleep(0.2);
    }
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: sa-platform-canary-analysis
spec:
  args:
    - name: service-url
  metrics:
    - name: smoke-health
      count: 2
      interval: 5s
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              metadata:
                labels:
                  app.kubernetes.io/part-of: sa-platform
                  p8-test: smoke
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 100
                  runAsGroup: 101
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: smoke
                    image: curlimages/curl:8.12.1
                    command: ["sh", "-c"]
                    args:
                      - 'curl --fail --silent --show-error --max-time 5 "{{ `{{args.service-url}}` }}"'
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                    resources:
                      requests: {cpu: 10m, memory: 16Mi}
                      limits: {cpu: 100m, memory: 64Mi}
                    volumeMounts:
                      - name: tmp
                        mountPath: /tmp
                volumes:
                  - name: tmp
                    emptyDir: {}
    - name: micro-load
      count: 1
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              metadata:
                labels:
                  app.kubernetes.io/part-of: sa-platform
                  p8-test: load
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 12345
                  runAsGroup: 12345
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: k6
                    image: grafana/k6:2.2.0
                    args: ["run", "/scripts/canary.js"]
                    env:
                      - name: TARGET_URL
                        value: {{ `{{args.service-url}}` | quote }}
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                    resources:
                      requests: {cpu: 25m, memory: 64Mi}
                      limits: {cpu: 250m, memory: 256Mi}
                    volumeMounts:
                      - name: scripts
                        mountPath: /scripts
                        readOnly: true
                      - name: tmp
                        mountPath: /tmp
                volumes:
                  - name: scripts
                    configMap:
                      name: sa-platform-canary-k6
                  - name: tmp
                    emptyDir: {}

{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-kafka-config
data:
  CLUSTER_ID: {{ .Values.clusterId | quote }}
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENERS: "SASL_PLAINTEXT://:29092,CONTROLLER://:29093"
  KAFKA_ADVERTISED_LISTENERS: {{ printf "SASL_PLAINTEXT://%s-kafka:29092" .Release.Name | quote }}
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT"
  KAFKA_CONTROLLER_QUORUM_VOTERS: {{ printf "1@%s-kafka-0.%s-kafka:29093" .Release.Name .Release.Name | quote }}
  KAFKA_INTER_BROKER_LISTENER_NAME: "SASL_PLAINTEXT"
  KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
  KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "PLAIN"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  KAFKA_LOG_DIRS: "/var/lib/kafka/data"
  KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: kafka
      port: 29092
      targetPort: kafka
    - name: controller
      port: 29093
      targetPort: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-kafka
spec:
  serviceName: {{ .Release.Name }}-kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/instance: {{ .Release.Name }}
        sa-platform/role: broker
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      serviceAccountName: sa-platform-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: kafka
              containerPort: 29092
            - name: controller
              containerPort: 29093
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-kafka-config
          startupProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
              subPath: kafka-logs
            - name: kafka-auth
              mountPath: /etc/kafka/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: kafka-auth
          secret:
            secretName: {{ .Values.secretName }}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-kafka-topics-{{ .Release.Revision }}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        sa-platform/role: kafka-init
    spec:
      serviceAccountName: sa-platform-runtime
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: topics
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c"]
          args:
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ .Release.Name }}-kafka:29092 --command-config /etc/kafka/secrets/client.properties --list >/dev/null 2>&1; do sleep 3; done
              for topic in auth.register auth.login auth.refresh auth.logout auth.me authorization.bootstrap authorization.check authorization.roles authorization.permissions product.create product.get product.list product.update product.reserve order.create order.get order.list order.cancel payment.create payment.get payment.refund payment.completed payment.failed customer.upsert customer.get customer.address.create cron.summary.generated; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ .Release.Name }}-kafka:29092 --command-config /etc/kafka/secrets/client.properties --create --if-not-exists --topic "$topic" --partitions 3 --replication-factor 1
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ .Release.Name }}-kafka:29092 --command-config /etc/kafka/secrets/client.properties --create --if-not-exists --topic "$topic.reply" --partitions 3 --replication-factor 1
              done
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: kafka-auth
              mountPath: /etc/kafka/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: kafka-auth
          secret:
            secretName: {{ .Values.secretName }}
        - name: tmp
          emptyDir: {}
{{- end }}


enabled: true
replicaCount: 2

image:
  repository: ghcr.io/example/sa-authorization-ms
  tag: "1.0.0"
  pullPolicy: IfNotPresent

port: 3004
healthPath: /health
secretName: sa-platform-authorization-db-secret
jwtSecretName: ""

global:
  kafkaBrokers: sa-platform-kafka:29092
  kafkaSecurityProtocol: SASL_PLAINTEXT
  kafkaSecretName: sa-platform-kafka-secret
  serviceAccountName: sa-platform-runtime

env:
  SERVICE_NAME: authorization

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 384Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  minAvailable: 1

analysisTemplateName: sa-platform-canary-analysis
canary:
  scaleDownDelaySeconds: 30
  steps:
    - weight: 10
      pause: 20s
    - weight: 30
      pause: 20s
    - weight: 60
      pause: 30s

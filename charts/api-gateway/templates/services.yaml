{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sa-service.fullname" . }}
  labels:
    {{- include "sa-service.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "sa-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sa-service.fullname" . }}-canary
  labels:
    {{- include "sa-service.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "sa-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
{{- end }}


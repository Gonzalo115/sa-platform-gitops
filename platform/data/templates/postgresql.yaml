apiVersion: v1
kind: ConfigMap
metadata:
  name: sa-platform-postgresql-init
data:
  01-create-databases.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    for database in products_db orders_db customers_db payments_db authentication_db authorization_db; do
      if ! psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres -tAc \
        "SELECT 1 FROM pg_database WHERE datname='${database}'" | grep -q 1; then
        createdb --username "$POSTGRES_USER" --owner "$POSTGRES_USER" "$database"
      fi
    done
---
apiVersion: v1
kind: Service
metadata:
  name: sa-platform-postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: sa-platform
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: sa-platform
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sa-platform-postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: sa-platform
spec:
  serviceName: sa-platform-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/part-of: sa-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/part-of: sa-platform
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      serviceAccountName: sa-platform-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: sa-platform-postgresql-admin
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d postgres']
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d postgres']
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d postgres']
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-create-databases.sh
              subPath: 01-create-databases.sh
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: init
          configMap:
            name: sa-platform-postgresql-init
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgresql
          app.kubernetes.io/part-of: sa-platform
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sa-platform-postgresql
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/part-of: sa-platform
